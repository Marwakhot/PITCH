body { margin: 0; background: var(--paper); overflow: hidden; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
/* fonts are injected as @font-face above this file: InvDisp (400/500), InvLight (300), InvMono (400/700) */
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
#cam { position: absolute; inset: 0; transform-origin: 0 0; }
#stack { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 960px 380px; }
#fx { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 50; }
#splash { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
#splash .name { position: absolute; left: 0; right: 0; top: 600px; text-align: center; font: 300 47px/1 InvLight, sans-serif; color: #131207; letter-spacing: .43em; padding-left: .43em; }
#splash .press { position: absolute; left: 0; right: 0; top: 707px; text-align: center; font: 400 17px/1 InvMono, monospace; color: #a6a6a6; letter-spacing: .3em; padding-left: .3em; }

.card { position: absolute; left: 390.5px; top: 188px; width: 1139px; height: 728px; transform-origin: 50% 100%; will-change: transform, opacity; box-shadow: 0 36px 80px -18px rgba(25, 25, 45, .28), 0 4px 14px rgba(25, 25, 45, .06); }
.card .inner { position: absolute; left: 0; top: 0; width: 958px; height: 612px; transform: scale(1.189); transform-origin: 0 0; overflow: hidden;
  --gl: #d7d7d9; background-color: #e6e6e7;
  background-image: linear-gradient(to right, var(--gl) 1px, transparent 1px), linear-gradient(to bottom, var(--gl) 1px, transparent 1px);
  background-size: 48px 48px; background-position: 47px 45px; border: 1px solid rgba(0, 0, 0, .07); }
.card .inner.white { --gl: #f0f0f0; background-color: #fff; }
.card .inner.blue { --gl: rgba(255, 255, 255, .09); background-color: #2f44bb; color: #fff; }
.card .shade { position: absolute; inset: 0; background: #1b1b24; opacity: 0; pointer-events: none; }
.card .gfx { position: absolute; left: 0; top: 0; }
.card .hdr { position: absolute; left: 20px; right: 20px; top: 15px; display: flex; justify-content: space-between; font: 400 11px/1.2 InvMono, monospace; letter-spacing: .14em; color: #262626; }
.card .inner.white .hdr { top: 16px; font-size: 13px; letter-spacing: .1em; color: #151515; }
.card .inner.blue .hdr, .card .inner.blue .cap, .card .inner.blue .count { color: rgba(255, 255, 255, .85); }
.card .hdr .dim { color: #7a7a7a; }
.card .blk { display: inline-block; width: 8px; height: 8px; background: #111; margin-right: 10px; vertical-align: 1px; }
.card .hline { position: absolute; left: 0; right: 0; top: 45px; height: 1px; background: #dedede; }
.card .sq { position: absolute; left: 27px; top: 70px; width: 83px; height: 82px; border: 1.5px solid rgba(0, 0, 0, .22); }
.card .inner.blue .sq { border-color: rgba(255, 255, 255, .3); }
.card .cap { position: absolute; left: 33px; top: 474px; font: 400 11px/1.2 InvMono, monospace; letter-spacing: .16em; color: #3b3b3b; }
.card .title { position: absolute; left: 30px; top: 495px; font: 500 66px/1 InvDisp, sans-serif; letter-spacing: -.028em; color: #111; white-space: nowrap; }
.card .inner.blue .title { color: #fff; }
.card .count { position: absolute; right: 37px; top: 557px; font: 400 11px/1 InvMono, monospace; letter-spacing: .14em; color: #3b3b3b; }
.card .body { position: absolute; left: 33px; top: 330px; width: 430px; font: 400 19px/1.4 InvDisp, sans-serif; color: #3a3a3d; }
.card .inner.blue .body { color: rgba(255, 255, 255, .85); }
.card .files { position: absolute; left: 20px; top: 504px; width: 86px; height: 86px; border: 1px solid #cdcdcd; background: #fff; text-align: center; }
.card .files small { display: block; margin-top: 16px; font: 400 8.5px/1 InvMono, monospace; letter-spacing: .2em; color: #8a8a8a; }
.card .files b { display: block; margin-top: 9px; font: 400 22px/1 InvMono, monospace; color: #111; }
.card .btn { position: absolute; left: 860px; top: 513px; width: 75px; height: 75px; background: #2f4ad8; }
.card .btn i { position: absolute; left: 24px; top: 24px; width: 27px; height: 27px; background: #fff; }
.card .word { position: absolute; left: 0; right: 0; top: 268px; text-align: center; font: 400 113px/1 InvDisp, sans-serif; letter-spacing: -.018em; color: #121214; white-space: nowrap; }
.card .word span { display: inline-block; }
.card .word.thanks { font-size: 92px; top: 290px; }
.card .sub { position: absolute; left: 178px; top: 397px; width: 602px; height: 31px; box-sizing: border-box; background: #fafafa; border: 1px solid #ececec; text-align: center; font: 700 14.5px/29px InvMono, monospace; letter-spacing: .24em; color: #a0a0a4; white-space: nowrap; }

/* Content cards. Coordinates are reference px inside the 958 x 612 card. */
.k-hdr { position: absolute; left: 20px; right: 20px; top: 15px; display: flex; justify-content: space-between; font: 400 12px/1.2 InvMono, monospace; letter-spacing: .14em; color: #262626; }
.inner.white .k-hdr { top: 16px; }
.inner.blue .k-hdr, .inner.blue .k-cap, .inner.blue .k-count { color: rgba(255, 255, 255, .82); }
.k-hline { position: absolute; left: 0; right: 0; top: 45px; height: 1px; background: #dedede; }
.k-cap { font: 400 12px/1.3 InvMono, monospace; letter-spacing: .16em; color: #4a4a4c; text-transform: uppercase; }
.k-t { font: 500 48px/1.02 InvDisp, sans-serif; letter-spacing: -.028em; color: #111; margin: 10px 0 0; text-wrap: balance; }
.k-top { position: absolute; left: 33px; top: 74px; }
.k-count { position: absolute; right: 37px; bottom: 26px; font: 400 12px/1 InvMono, monospace; letter-spacing: .14em; color: #3b3b3b; }
.k-text { font: 400 17px/1.36 InvDisp, sans-serif; color: #1c1c1e; }
.k-mono { font: 400 11px/1.3 InvMono, monospace; letter-spacing: .18em; color: #6b6b6f; text-transform: uppercase; }

/* rows (problem list, trust list) */
.k-rows { position: absolute; display: flex; flex-direction: column; }
.k-row { display: grid; align-items: center; border-top: 1px solid rgba(0, 0, 0, .14); }
.k-row:last-child { border-bottom: 1px solid rgba(0, 0, 0, .14); }
.k-idx { font: 400 12px/1 InvMono, monospace; letter-spacing: .14em; color: #6b6b6f; }

/* 1 problem: two locations */
.loc { position: absolute; top: 262px; width: 182px; height: 168px; box-sizing: border-box; border: 1.5px solid #1b1b1d; background: rgba(255, 255, 255, .55); padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; }
.loc b { font: 500 58px/1 InvDisp, sans-serif; letter-spacing: -.03em; color: #111; }
.loc.short { background: repeating-linear-gradient(135deg, rgba(0, 0, 0, .06) 0 8px, rgba(255, 255, 255, .4) 8px 16px); }
.loc.short b { color: #8d8d92; }
.loc-arrow { position: absolute; left: 218px; top: 336px; width: 30px; height: 2px; border-top: 2px dashed #1b1b1d; }
.loc-arrow::after { content: ""; position: absolute; right: -2px; top: -6px; border: 5px solid transparent; border-left: 8px solid #1b1b1d; }

/* 2 solution */
.sol-word { position: absolute; left: 0; right: 0; top: 196px; text-align: center; font: 400 104px/1 InvDisp, sans-serif; letter-spacing: -.02em; color: #121214; }
.sol-line { position: absolute; left: 150px; right: 150px; top: 330px; text-align: center; font: 400 23px/1.4 InvDisp, sans-serif; color: #2a2a2d; text-wrap: balance; }
.sol-chips { position: absolute; left: 0; right: 0; top: 470px; display: flex; justify-content: center; gap: 14px; }
.sol-chips span { font: 700 12px/1 InvMono, monospace; letter-spacing: .2em; color: #8f8f94; background: #fafafa; border: 1px solid #e6e6e6; padding: 10px 14px; }
.sol-cap { position: absolute; left: 0; right: 0; top: 74px; text-align: center; }

/* 4 bot line */
.quote { position: absolute; left: 238px; top: 150px; width: 660px; font: 400 38px/1.2 InvDisp, sans-serif; letter-spacing: -.012em; color: #fff; text-wrap: pretty; }
.quote .w { display: inline-block; white-space: pre; }
.quote .qm { position: absolute; left: -42px; top: -16px; font: 500 86px/1 InvDisp, sans-serif; color: rgba(255, 255, 255, .35); }
.ask { position: absolute; left: 238px; top: 96px; font: 400 12px/1.2 InvMono, monospace; letter-spacing: .18em; color: rgba(255, 255, 255, .7); }
.sig { position: absolute; left: 238px; top: 490px; font: 400 12px/1.2 InvMono, monospace; letter-spacing: .18em; color: rgba(255, 255, 255, .7); }

/* 5 comparison */
.cmp { position: absolute; left: 33px; top: 156px; width: 892px; }
.cmp .k-row { grid-template-columns: 1fr 1fr; height: 54px; gap: 0 30px; }
.cmp .head { height: 30px; border-top: 0; }
.cmp .old { color: #6f6f74; font: 400 16px/1.28 InvDisp, sans-serif; padding-left: 0; }
.cmp .new { color: #111; font: 500 16px/1.28 InvDisp, sans-serif; position: relative; padding-left: 20px; }
.cmp .new::before { content: ""; position: absolute; left: 0; top: 50%; width: 8px; height: 8px; margin-top: -4px; background: #2f4ad8; }

/* 6 performance */
.perf-note { position: absolute; left: 33px; top: 158px; width: 560px; }
.perf-chart { position: absolute; left: 33px; top: 190px; width: 560px; height: 340px; }
.perf-stats { position: absolute; left: 640px; top: 176px; width: 286px; display: flex; flex-direction: column; }
.stat { padding: 16px 0; border-top: 1px solid rgba(0, 0, 0, .12); }
.stat:last-child { border-bottom: 1px solid rgba(0, 0, 0, .12); }
.stat b { display: block; font: 500 44px/1 InvDisp, sans-serif; letter-spacing: -.03em; color: #111; margin-bottom: 8px; }

/* 7 trust */
.trust { left: 372px; top: 64px; width: 556px; }
.trust .k-row { grid-template-columns: 48px 1fr; height: 64px; }
.box { width: 30px; height: 30px; box-sizing: border-box; border: 3px solid #1b1b1d; position: relative; background: rgba(255, 255, 255, .55); }
.box svg { position: absolute; left: 1px; top: 1px; opacity: 0; transition: opacity .2s ease; }
.box.on svg { opacity: 1; }
.tstat { position: absolute; left: 33px; display: flex; flex-direction: column; gap: 6px; }
.tstat b { font: 500 56px/1 InvDisp, sans-serif; letter-spacing: -.03em; color: #111; }

/* 8 value */
.vgrid { position: absolute; left: 33px; top: 214px; width: 892px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.vcell { background: #fff; border: 1px solid #e2e2e2; height: 150px; box-sizing: border-box; padding: 18px 20px; display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; }
.vcell .k-text { font-size: 21px; line-height: 1.3; }
.vcell .k-mono { display: block; margin-bottom: 8px; }

/* thank you: a blank white page, only the orb */
.card.blank { box-shadow: none; }
.card .inner.blank { background: #fff; background-image: none; border: 0; }
.card .inner.blank .shade { display: none; }
.bye-t { position: absolute; left: 0; right: 0; top: 90px; margin: 0; text-align: center; font-size: 64px; }
.bye-note { position: absolute; left: 179px; width: 600px; top: 430px; text-align: center; font-size: 20px; color: #5a5a5f; }

/* in-scope screenshots + out-of-scope video */
.shot-line { position: absolute; left: 33px; right: 160px; top: 126px; color: #5a5a5f; font-size: 16px; }
.shot { position: absolute; left: 45px; top: 160px; width: 867px; height: 402px; border: 1px solid #dcdcdf; box-shadow: 0 18px 40px -22px rgba(20, 20, 40, .35); background: #fff; overflow: hidden; }
.shot img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
.shot.vid { background: #0f1015; cursor: pointer; }
.shot video { display: block; width: 100%; height: 100%; object-fit: contain; background: #fff; }
.vbar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0, 0, 0, .08); }
.vbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #2f4ad8; }
.vhint { position: absolute; right: 10px; top: 10px; font: 400 9px/1 InvMono, monospace; letter-spacing: .18em; color: #8a8a90; background: rgba(255, 255, 255, .85); padding: 6px 8px; opacity: 0; transition: opacity .3s; }
.shot.vid:hover .vhint { opacity: 1; }
.shot.vid.paused .vhint { opacity: 1; }

#stage { position: fixed; left: 50%; top: 50%; transform-origin: 50% 50%; cursor: pointer; user-select: none; }

  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  font: 400 12px/1.4 InvMono, monospace; letter-spacing: .08em; color: #9aa0b8; transition: opacity .6s ease; }

#hud .keys { display: flex; flex-wrap: wrap; gap: 6px 16px; }

#editbar { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 81; background: var(--orb); color: #fff; font: 400 13px/1 InvMono, monospace; letter-spacing: .06em; padding: 12px 18px; }

<script>// Shared orb drawing: glossy body, soft emitted glow, attached oval arms. No ground shadow anywhere.
(function () {
  const lerp = (a, b, k) => a + (b - a) * k;
  const ORB = {};
  // body. deep: 0..1 (breathing saturation)
  ORB.body = function (c, x, y, r, o = {}) {
    const sx = o.sx ?? 1, sy = o.sy ?? 1, rot = o.rot ?? 0, lean = o.lean ?? 0, look = o.look ?? [-.35, -.42], d = o.deep ?? .5, alpha = o.alpha ?? 1;
    c.save(); c.globalAlpha = alpha; c.translate(x, y);
    c.rotate(rot); c.scale(sx, sy); c.rotate(-rot); c.rotate(lean);
    if (o.glow !== false) {
      const gr = c.createRadialGradient(0, 0, r * .8, 0, 0, r * 2.2);
      gr.addColorStop(0, `rgba(118,136,255,${.2 + .1 * d})`); gr.addColorStop(.45, `rgba(140,155,255,${.07 + .04 * d})`); gr.addColorStop(1, 'rgba(140,155,255,0)');
      c.fillStyle = gr; c.beginPath(); c.arc(0, 0, r * 2.2, 0, 7); c.fill();
    }
    const hx = (-.1 + look[0] * .45) * r, hy = (-.12 + look[1] * .45) * r;
    const g = c.createRadialGradient(hx * 1.25, hy * 1.25, r * .03, hx * .3, hy * .3, r * 1.1);
    g.addColorStop(0, '#f7f8ff');
    g.addColorStop(.3, `rgb(${lerp(198, 180, d)},${lerp(207, 192, d)},255)`);
    g.addColorStop(.68, `rgb(${lerp(128, 104, d)},${lerp(146, 124, d)},${lerp(250, 246, d)})`);
    g.addColorStop(.92, `rgb(${lerp(78, 58, d)},${lerp(98, 80, d)},${lerp(234, 228, d)})`);
    g.addColorStop(1, `rgb(${lerp(66, 48, d)},${lerp(86, 68, d)},${lerp(226, 218, d)})`);
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, 7); c.fill();
    c.restore();
  };
  // big faint aura of the splash screen
  ORB.aura = function (c, x, y, r, k, d) {
    if (k <= .005) return;
    const R = r * 4.8;
    const g = c.createRadialGradient(x, y, r * .9, x, y, R);
    g.addColorStop(0, `rgba(226,229,254,${(.75 + .25 * d) * k})`);
    g.addColorStop(.3, `rgba(240,240,253,${.55 * k})`);
    g.addColorStop(.7, `rgba(248,248,253,${.4 * k})`);
    g.addColorStop(.97, `rgba(251,251,253,${.3 * k})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, R, 0, 7); c.fill();
  };
  // an attached oval arm. ang: screen angle the arm points to; grow 0..1; bend: extra rotation of the oval about its root
  ORB.arm = function (c, x, y, r, ang, grow, o = {}) {
    if (grow <= .01) return;
    const len = r * .62 * grow, wid = r * .23 * Math.min(1, grow * 1.4);
    const root = r * .78;                      // root sits inside the body edge, so it reads as attached
    const cx = x + Math.cos(ang) * (root + len * .5), cy = y + Math.sin(ang) * (root + len * .5);
    c.save(); c.translate(cx, cy); c.rotate(ang);
    const g = c.createLinearGradient(0, -wid, 0, wid);
    g.addColorStop(0, '#c3cdff'); g.addColorStop(.45, '#7d93fb'); g.addColorStop(1, '#3f55e0');
    c.fillStyle = g; c.beginPath(); c.ellipse(0, 0, len * .62 + wid * .2, wid, 0, 0, 7); c.fill();
    // soft highlight
    c.fillStyle = 'rgba(255,255,255,.35)'; c.beginPath(); c.ellipse(len * .08, -wid * .38, len * .3, wid * .25, 0, 0, 7); c.fill();
    c.restore();
  };
  window.ORB = ORB;
})();
</script>

      }
      case 'line': {
        svgEl('rect', { x: 655, y: 63, width: 114, height: 45, fill: '#d5d5da' }, s);
        svgEl('rect', { x: 527, y: 177, width: 112, height: 45, fill: '#d5d5da' }, s);

      case 'tiles': {

        svgEl('line', { x1: 748, x2: 914, y1: 262, y2: 262, stroke: ink, 'stroke-width': 5 }, s);

      case 'boxes': {
        svgEl('rect', { x: 532, y: 89, width: 120, height: 224, fill: 'none', stroke: ink, 'stroke-width': 3 }, s);

        svgEl('rect', { x: 801, y: 89, width: 123, height: 224, fill: 'none', stroke: '#8b8b8e', 'stroke-width': 3 }, s);

        svgEl('rect', { x: 821, y: 271, width: 79, height: 13, fill: '#8b8b8e' }, s);
        break;
      }
      case 'checks': {
        [[98, 281], [174, 215], [252, 151]].forEach(([y, w], i) => {
          svgEl('rect', { x: 536, y, width: 48, height: 48, fill: 'none', stroke: ink, 'stroke-width': 5, 'data-box': i }, s);
          svgEl('polyline', { points: `${546},${y + 25} ${557},${y + 37} ${578},${y + 10}`, fill: 'none', stroke: ink, 'stroke-width': 6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'data-tick': i }, s);

  function build(key, opts = {}) {
    if (opts.html) { // custom content card
      const card = document.createElement('div'); card.className = 'card'; card.dataset.key = key;
      const inner = document.createElement('div'); inner.className = 'inner ' + (opts.tone || 'grey'); inner.innerHTML = opts.html;
      card.appendChild(inner);
      const shade = document.createElement('div'); shade.className = 'shade'; inner.appendChild(shade);
      card._shade = shade; card._inner = inner; return card;
    }
    const d = DEFS[key];
    const card = document.createElement('div'); card.className = 'card'; card.dataset.key = key;
    const inner = document.createElement('div'); inner.className = 'inner ' + (d.blue ? 'blue' : (d.kind ? 'white' : 'grey'));
    card.appendChild(inner);
    if (d.kind === 'welcome' || d.kind === 'thanks') {
      inner.innerHTML = `
        <div class="hline"></div>
        <div class="hdr"><span><i class="blk"></i>INVENTRA</span><span class="dim">GULFTRADE SUPPLIES</span><span>WELCOME, SARA</span></div>
        <div class="files"><small>FILES</small><b>08</b></div>
        <div class="btn"><i></i></div>
        ${d.kind === 'welcome'
          ? `<div class="word">${'inventra'.split('').map(ch => `<span>${ch}</span>`).join('')}</div>
             <div class="sub">INVENTORY PLANNING, PROVEN AGAINST SOURCE DATA</div>`

             <div class="sub" data-edit>[YOUR@EMAIL.COM] · [WEBSITE]</div>`}`;
    } else {
      inner.innerHTML = `
        <div class="hdr"><span>INVENTRA</span><span>${d.label}</span><span>${d.num}</span></div>
        <div class="sq"></div>
        <div class="cap" data-edit>${d.cap}</div>
        <div class="title" data-edit>${d.title}</div>
        <div class="count">${d.num} / 08</div>`;
      inner.appendChild(graphic(d.g, d.blue));
      if (opts.body) { const b = document.createElement('div'); b.className = 'body'; b.dataset.edit = ''; b.textContent = opts.body; inner.appendChild(b); }
    }
    const shade = document.createElement('div'); shade.className = 'shade'; inner.appendChild(shade);
    card._shade = shade; card._inner = inner;
    return card;
  }

  // pose: { depth (0 front, continuous), enter (0..1, 1 = in place), exit (0..1, 0 = in place) }
  function pose(card, p) {
    const depth = Math.max(0, p.depth || 0), e = p.enter ?? 1, x = p.exit ?? 0;
    const H = CH * S;
    const s = 1 - .024 * depth;
    let ty = -(11.5 * depth + H * (1 - s)), rx = 0, op = 1, shade = Math.min(.5, .045 * depth);
    if (depth > 6) op = Math.max(0, 1 - (depth - 6));
    if (e < 1) { const k = 1 - e; ty += 250 * k; rx += 62 * k; op *= .2 + .8 * e; shade += .1 * k; }
    if (x > 0) { ty += 380 * x; rx += 80 * x; op *= Math.pow(1 - x, .8); shade += .18 * x; }
    card.style.transform = `translateY(${ty}px) rotateX(${rx}deg) scale(${s})`;
    card.style.opacity = op;
    card._shade.style.opacity = shade;
    card.style.visibility = op <= .002 ? 'hidden' : 'visible';
  }

  window.CARDS = { build, pose, DEFS, S, CW, CH, LEFT, TOP, local: (x, y) => [LEFT + x * S, TOP + y * S] };
})();

<script>// Intro: exact clone of the Inventra reference (splash -> card stack -> welcome card),
// then the orb comes to life, grows oval arms, zooms around the card and out of the screen.
// Deterministic: INTRO.render(t).
(function () {
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const eOut = k => 1 - Math.pow(1 - k, 3);
  const eIn = k => k * k * k;
  const eElastic = k => k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2, -9 * k) * Math.sin((k * 10 - .75) * (2 * Math.PI / 3)) + 1;
  const damp = (t, f = 14, d = 7) => t < 0 ? 0 : Math.exp(-d * t) * Math.cos(f * t);
  const dampS = (t, f = 14, d = 7) => t < 0 ? 0 : Math.exp(-d * t) * Math.sin(f * t);
  const mix2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
  const PI = Math.PI;

  const stage = document.getElementById('stage');
  const stack = document.getElementById('stack');
  const fx = document.getElementById('fx'), c = fx.getContext('2d');
  const splash = document.getElementById('splash');

  // ---------- cards ----------
  const ENTER = ['welcome', 'dc', 'sl', 'ds', 'nw', 'fc', 'dh', 'cc'];
  const EXIT = ['cc', 'dh', 'fc', 'nw', 'ds', 'sl', 'dc'];
  const cards = {};
  ENTER.forEach((k, i) => { const el = CARDS.build(k); el.style.zIndex = 10 + i; stack.appendChild(el); cards[k] = el; });
  const enterT = { welcome: 4.74 }; ENTER.slice(1).forEach((k, i) => enterT[k] = 4.86 + i * .078);
  const exitT = {}; EXIT.forEach((k, i) => exitT[k] = 6.12 + i * .2);
  const ENTER_DUR = .27, EXIT_DUR = .3;
  const E = (k, t) => eOut(prog(t, enterT[k], enterT[k] + ENTER_DUR));
  const X = (k, t) => exitT[k] == null ? 0 : eIO(prog(t, exitT[k], exitT[k] + EXIT_DUR));

  const letters = [...cards.welcome.querySelectorAll('.word span')];
  const sub = cards.welcome.querySelector('.sub');

  // ---------- timeline ----------
  const T = {
    splashOut: 4.72, orbIn: 7.6, write: 7.78, sub: 8.38, freeze: 8.87,
    shiver: 9.35, gasp: 9.7, looks: 10.1, arm1: 11.3, arm2: 11.95, flex: 12.5, antic: 13.0, launch: 13.25, zoomEnd: 15.95, end: 16.6,
  };
  const SPLASH = { x: 960, y: 505, r: 68 };
  const HOME = { x: 960, y: 446, r: 41.6 };
  const breath = t => Math.sin(2 * PI * (t - .22) / 3.1);

  // ---------- zoom path (smooth, constant speed — same feel as the first version) ----------
  const ZP = [[HOME.x, HOME.y], [1260, 190], [1690, 260], [1770, 680], [1510, 990], [900, 1015], [300, 935], [170, 520], [330, 150], [800, 105], [1170, 330], [930, 640], [610, 560], [760, 330], [1350, 250], [2350, -180]];
  function catmull(p, u) {
    const n = p.length - 1, f = u * n; let i = Math.min(Math.floor(f), n - 1); const k = f - i;
    const p0 = p[Math.max(i - 1, 0)], p1 = p[i], p2 = p[i + 1], p3 = p[Math.min(i + 2, n)], k2 = k * k, k3 = k2 * k;
    const cc = (a, b, c_, d) => .5 * ((2 * b) + (-a + c_) * k + (2 * a - 5 * b + 4 * c_ - d) * k2 + (-a + 3 * b - 3 * c_ + d) * k3);
    return [cc(p0[0], p1[0], p2[0], p3[0]), cc(p0[1], p1[1], p2[1], p3[1])];
  }
  const ZT = (() => { const N = 4000, tab = [0]; let pr = catmull(ZP, 0), L = 0; for (let i = 1; i <= N; i++) { const q = catmull(ZP, i / N); L += Math.hypot(q[0] - pr[0], q[1] - pr[1]); tab.push(L); pr = q; } return { tab, L, N }; })();
  function zoomAt(s) {
    const target = clamp(s) * ZT.L, tab = ZT.tab; let lo = 0, hi = ZT.N;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (tab[m] < target) lo = m; else hi = m; }
    return catmull(ZP, (lo + (target - tab[lo]) / ((tab[hi] - tab[lo]) || 1)) / ZT.N);
  }
  function zoomS(t) { // quick ramp then a steady cruise straight out of frame
    const u = prog(t, T.launch, T.zoomEnd), a = .08, vmax = 1 / (1 - a / 2);
    return u < a ? vmax * u * u / (2 * a) : vmax * (a / 2 + (u - a));
  }

  // ---------- the living orb (pure function of t) ----------
  const lookKeys = [[T.looks, [-.35, -.42]], [T.looks + .15, [-.95, -.1]], [T.looks + .35, [-.95, -.1]], [T.looks + .5, [.95, -.1]], [T.looks + .7, [.95, -.1]], [T.looks + .85, [0, .95]], [T.looks + 1.0, [0, .95]], [T.looks + 1.15, [-.05, -.2]]];
  function keyLook(t) {
    if (t <= lookKeys[0][0]) return lookKeys[0][1];
    for (let i = 0; i < lookKeys.length - 1; i++) { const [t0, a] = lookKeys[i], [t1, b] = lookKeys[i + 1]; if (t < t1) return mix2(a, b, eIO(prog(t, t0, t1))); }
    return lookKeys[lookKeys.length - 1][1];
  }
  function orbS(t) {
    const o = { x: HOME.x, y: HOME.y, r: HOME.r, sx: 1, sy: 1, rot: 0, lean: 0, look: [-.35, -.42], deep: .5, vis: true, vel: [0, 0], speed: 0, along: false };
    if (t < T.shiver) return o;
    if (t < T.gasp) { const e = Math.sin(PI * prog(t, T.shiver, T.gasp)); o.x += Math.sin(t * 120) * 2.2 * e; return o; }
    const g = t - T.gasp;
    if (g < .6) { const st = g < .2 ? .16 * Math.sin(PI / 2 * g / .2) : .16 * damp(g - .2, 18, 7); o.sy = 1 + st; o.sx = 1 - st * .6; o.y -= 12 * Math.sin(PI * clamp(g / .4)); }
    o.look = keyLook(t); o.lean = o.look[0] * .1;
    const p1 = t - T.arm1, p2 = t - T.arm2;
    if (p1 > 0 && p1 < .3) { const j = Math.sin(PI * p1 / .3) * (1 - p1 / .3); o.x -= 7 * j; o.sx *= 1 + .07 * j; o.sy *= 1 - .07 * j; }
    if (p2 > 0 && p2 < .3) { const j = Math.sin(PI * p2 / .3) * (1 - p2 / .3); o.x += 7 * j; o.sx *= 1 + .07 * j; o.sy *= 1 - .07 * j; }
    if (t > T.arm1 - .05) {
      const lR = eIO(prog(t, T.arm1 + .14, T.arm1 + .3)) - eIO(prog(t, T.arm1 + .5, T.arm1 + .62));
      const lL = eIO(prog(t, T.arm2 + .14, T.arm2 + .3)) - eIO(prog(t, T.arm2 + .5, T.arm2 + .62));
      o.look = [-.05 + .95 * lR - .95 * lL, -.2 + .5 * (lR + lL)]; o.lean = .18 * lR - .18 * lL;
    }
    if (t > T.flex && t < T.antic) { const k = prog(t, T.flex, T.antic); const b = Math.abs(Math.sin(k * PI * 2)); o.y -= 14 * b; o.sy *= 1 + .06 * b; o.sx *= 1 - .04 * b; }
    if (t < T.antic) return o;
    if (t < T.launch) { const s = Math.sin(PI / 2 * prog(t, T.antic, T.launch)); o.sy *= 1 - .26 * s; o.sx *= 1 + .2 * s; o.y += o.r * .22 * s; o.look = [.5 * s, -.5 * s]; o.lean = -.2 * s; return o; }
    if (t < T.zoomEnd + .1) {
      const dt = 1 / 240, p = zoomAt(zoomS(t)), q = zoomAt(zoomS(t + dt));
      o.x = p[0]; o.y = p[1];
      if (t < T.launch + .1) o.y = lerp(HOME.y + o.r * .22, p[1], eOut(prog(t, T.launch, T.launch + .1)));
      const vx = (q[0] - p[0]) / dt, vy = (q[1] - p[1]) / dt, sp = Math.hypot(vx, vy) || 1;
      o.vel = [vx, vy]; o.speed = sp; o.along = true; o.rot = Math.atan2(vy, vx);
      const st = clamp(sp / 5200, 0, .55); o.sx = 1 + st; o.sy = 1 / Math.sqrt(1 + st * 1.4);
      o.look = [vx / sp * .85, vy / sp * .85];
      if (o.x > 2100 || o.y < -150) o.vis = false;
      return o;
    }
    o.vis = false; return o;
  }
  // arm angles + growth
  function arms(t, o) {
    const g1 = eElastic(clamp((t - T.arm1) / .45)), g2 = eElastic(clamp((t - T.arm2) / .45));
    let aR = .5 + Math.sin(t * 2.6) * .07, aL = PI - .5 - Math.sin(t * 2.6 + 1) * .07;
    // test-wiggle each new arm
    const w1 = prog(t, T.arm1 + .3, T.arm1 + .75), w2 = prog(t, T.arm2 + .3, T.arm2 + .75);
    if (w1 > 0 && w1 < 1) aR += Math.sin(w1 * PI * 5) * .55 * Math.sin(w1 * PI);
    if (w2 > 0 && w2 < 1) aL -= Math.sin(w2 * PI * 5) * .55 * Math.sin(w2 * PI);
    // flex: both arms pump up
    if (t > T.flex && t < T.antic) { const k = prog(t, T.flex, T.antic), b = Math.abs(Math.sin(k * PI * 2)); aR = lerp(aR, -.75, b); aL = lerp(aL, PI + .75, b); }
    // wind-up: arms swing back
    const an = eOut(prog(t, T.antic, T.launch)); aR = lerp(aR, -.2, an); aL = lerp(aL, PI + .2, an);
    // flight: trail behind and flap
    if (t >= T.launch) {
      const back = Math.atan2(-o.vel[1], -o.vel[0]), flap = Math.sin(t * 34) * .3, k = eOut(prog(t, T.launch, T.launch + .15));
      aR = lerp(aR, back - .55 + flap, k); aL = lerp(aL, back + .55 - flap, k);
    }
    return { aR, aL, g1, g2 };
  }
  function drawLiving(t, o, alpha = 1) {
    const a = arms(t, o);
    const rr = o.r * (o.sx + o.sy) / 2;
    c.save(); c.globalAlpha = alpha;
    ORB.arm(c, o.x, o.y, rr, a.aR, a.g1); ORB.arm(c, o.x, o.y, rr, a.aL, a.g2);
    c.restore();
    ORB.body(c, o.x, o.y, o.r, { sx: o.sx, sy: o.sy, rot: o.along ? o.rot : 0, lean: o.lean, look: o.look, alpha });
  }

  // letters bump as the orb whooshes across the word
  const wordBox = (() => { const [x0, y0] = CARDS.local(300, 280), [x1, y1] = CARDS.local(660, 365); return { x0, y0, x1, y1 }; })();
  const passTimes = letters.map((_, i) => {
    const lx = lerp(wordBox.x0 + 25, wordBox.x1 - 25, i / 7);
    for (let t = T.launch; t < T.zoomEnd; t += 1 / 240) { const o = orbS(t); if (Math.abs(o.x - lx) < 14 && o.y > wordBox.y0 - 60 && o.y < wordBox.y1 + 40) return t; }
    return null;
  });

  function speedLines(o, t) {
    if (!o.speed || o.speed < 900) return;
    const ux = o.vel[0] / o.speed, uy = o.vel[1] / o.speed, a = clamp((o.speed - 900) / 2500) * .5;
    c.save(); c.strokeStyle = `rgba(110,130,240,${a})`; c.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const off = (i - 3) * o.r * .3, rnd = (Math.sin(i * 12.9 + Math.floor(t * 30) * 4.1) + 1) / 2;
      const len = o.r * (1.6 + 2.4 * rnd), bx = o.x - ux * (o.r + 14) - uy * off, by = o.y - uy * (o.r + 14) + ux * off;
      c.lineWidth = 3 * (1 - Math.abs(off) / (o.r * 1.05)); if (c.lineWidth <= 0) continue;
      c.beginPath(); c.moveTo(bx, by); c.lineTo(bx - ux * len, by - uy * len); c.stroke();
    }
    c.restore();
  }

  // ---------- render ----------
  const cam = document.getElementById('cam');
  function camera(t) {
    const zk = eIO(prog(t, T.shiver + .05, T.gasp + .45)) * (1 - eIO(prog(t, T.antic - .15, T.launch + .2)));
    const Z = 1 + .9 * zk, cx = 960, cy = lerp(540, HOME.y + 25, zk);
    return { Z, ox: 960 - cx * Z, oy: 540 - cy * Z };
  }
  function render(t, opts = {}) {
    const cm = opts.noCam ? { Z: 1, ox: 0, oy: 0 } : camera(t);
    cam.style.transform = `translate(${cm.ox}px, ${cm.oy}px) scale(${cm.Z})`;
    // splash
    const so = 1 - eIO(prog(t, T.splashOut, T.splashOut + .22));
    splash.style.opacity = so; splash.style.visibility = so <= 0 ? 'hidden' : 'visible';
    splash.style.transform = `translateY(${-20 * (1 - so)}px)`;
    // stack
    ENTER.forEach((k, i) => {
      let depth = 0;
      for (let j = i + 1; j < ENTER.length; j++) depth += E(ENTER[j], t) - X(ENTER[j], t);
      const e = t < enterT[k] ? 0 : E(k, t);
      if (t < enterT[k]) { cards[k].style.visibility = 'hidden'; cards[k].style.opacity = 0; return; }
      CARDS.pose(cards[k], { depth, enter: e, exit: X(k, t) });
    });
    // welcome writing
    letters.forEach((s, i) => {
      const k = prog(t, T.write + i * .068, T.write + i * .068 + .2);
      let dy = 0; const p = passTimes[i]; if (p != null && t > p) dy = -14 * dampS(t - p, 14, 5.5);
      s.style.opacity = eOut(k); s.style.filter = k < 1 ? `blur(${(1 - k) * 9}px)` : 'none';
      s.style.transform = `translate(${(1 - eOut(k)) * 10}px, ${dy}px)`;
    });
    sub.style.opacity = eOut(prog(t, T.sub, T.sub + .25));

    // canvas layer
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 1920, 1080); c.setTransform(cm.Z, 0, 0, cm.Z, cm.ox, cm.oy);
    if (so > 0) { // splash orb, breathing exactly like the reference
      const s = breath(t), d = (s + 1) / 2, r = SPLASH.r * (1 + .04 * s);
      c.save(); c.globalAlpha = so;
      ORB.aura(c, SPLASH.x, SPLASH.y, SPLASH.r, 1, d);
      ORB.body(c, SPLASH.x, SPLASH.y - 20 * (1 - so), r, { deep: d });
      c.restore();
    }
    if (opts.hideOrb) return;
    if (t >= T.orbIn) {
      const k = eOut(prog(t, T.orbIn, T.orbIn + .25));
      const o = orbS(t);
      if (t < T.shiver) { const s = Math.sin(2 * PI * (t - T.orbIn) / 3.1) * .03; o.sx = o.sy = (.7 + .3 * k) * (1 + s * prog(t, T.orbIn + .3, T.orbIn + .8)); }
      if (o.vis) {
        if (t > T.launch && t < T.zoomEnd) {
          for (let j = 8; j >= 1; j--) { const q = orbS(t - j / 90); if (!q.vis) continue; ORB.body(c, q.x, q.y, q.r * (1 - j * .04), { sx: q.sx, sy: q.sy, rot: q.rot, look: q.look, alpha: .1 * (1 - j / 9), glow: false }); }
          speedLines(o, t);
        }
        drawLiving(t, o, k);
      }
    }
  }

  window.INTRO = { render, T, DUR: T.end, HOME, SPLASH, cards, ENTER, orbS };
})();
</script>
<script>// Deck orb: lives on its own canvas above the cards. Smooth swooping zooms (first-version feel),
// hops, attached oval arms, soft glow, no ground shadow.
(function () {
  const cv = document.getElementById('buddy'), c = cv.getContext('2d');
  const PI = Math.PI;
  const cl = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

      ${mono(544, wy(2) + 24, 'WITH INVENTRA', 'end', '#2f4ad8')}
      <text x="320" y="166" text-anchor="middle" font-family="InvDisp" font-weight="500" font-size="36" fill="#2f4ad8" letter-spacing="-1">AED 56,100</text>
      ${mono(320, 188, 'SALES RECOVERED', 'middle', '#2f4ad8')}
    </svg>
    <div class="perf-stats">
      <div class="stat"><b data-edit>−63%</b><span class="k-mono">Sales lost to stockouts</span></div>
      <div class="stat"><b data-edit>8.8×</b><span class="k-mono">Return on transfer costs · AED 6,400 spent</span></div>
      <div class="stat"><b data-edit>AED 18,500</b><span class="k-mono">Capital released from excess and ageing stock</span></div>
    </div>
    ${count('%N%')}` });
  // 7 — Trust
  S.push({ key: 'trust', tone: 'grey', html: `${hdr('TRUST', '%N%')}
    <div class="k-top"><div class="k-cap">%N% · Trust</div><div class="k-t" style="width:310px" data-edit>Why Inventra can be trusted</div></div>
    <div class="k-rows trust">${trust.map((t, i) => `<div class="k-row"><span class="box" data-box="${i}">${tick}</span><span class="k-text" style="font-size:16px" data-edit>${t}</span></div>`).join('')}</div>
    ${count('%N%')}` });
  // 8 — Business value
  S.push({ key: 'value', tone: 'white', html: `${hdrW('BUSINESS VALUE', '%N%')}
    <div class="k-top"><div class="k-cap">%N% · Commercial benefits</div><div class="k-t" data-edit>Business value</div></div>
    <div class="vgrid">
      <div class="vcell">${ICON.sales}<div><span class="k-mono">Sales</span><span class="k-text" data-edit>Higher sales from existing inventory</span></div></div>
      <div class="vcell">${ICON.transfer}<div><span class="k-mono">Transfers</span><span class="k-text" data-edit>Transfers recommended only where they are cost-effective</span></div></div>
      <div class="vcell">${ICON.capital}<div><span class="k-mono">Capital</span><span class="k-text" data-edit>Less capital tied up in excess and ageing stock</span></div></div>
      <div class="vcell">${ICON.trace}<div><span class="k-mono">Traceability</span><span class="k-text" data-edit>Full traceability of figures and approvals</span></div></div>
    </div>
    ${count('%N%')}` });

  // In scope: app screenshots (inserted after the solution)
  const SHOTS = [
    ['data', 'Data hub', 'Your source data, how clean it is, and every correction.', 800, [737, 503]],
    ['forecast-top', 'Demand forecast', 'Expected sales for the next 30 days, by product and location.', 760, [812, 409]],
    ['forecast-chart', 'Sales and forecast', 'Past sales, corrected for gaps, then the next 30 days.', 640, [705, 291]],
    ['disrupt-top', 'Disruptions', 'Outside news that delays deliveries or changes demand.', 870, [816, 330]],
    ['disrupt-time', 'When disruptions hit', 'Each signal’s delay or extra demand over the next 30 days.', 560, [586, 320]],
    ['network', 'Decision receipt', 'How the lead time and the quantity were reached.', 850, [685, 382]],
    ['log', 'Decision log', 'Every approved decision, frozen at approval and reviewed against actuals.', 850, [760, 330]],
  ];
  const shotCards = SHOTS.map(([img, title, line, perchX, look], i) => ({ key: 'shot-' + img, tone: 'white', shot: { perchX, look },
    html: `${hdrW('OUR FEATURES', '%N%')}
    <div class="k-top" style="top:62px"><div class="k-cap">%N% · Our features · ${i + 1} of ${SHOTS.length}</div><div class="k-t" style="font-size:37px" data-edit>${title}</div></div>
    <div class="shot-line k-text" data-edit>${line}</div>
    <div class="shot"><img src="media/${img}.jpg" alt="Inventra app: ${title}" width="1586" height="759"></div>
    ${count('%N%')}` }));
  const videoCard = { key: 'demo', tone: 'white', video: true, html: `${hdrW('OUR FEATURES', '%N%')}
    <div class="k-top" style="top:62px"><div class="k-cap">%N% · Our features · Live demo</div><div class="k-t" style="font-size:37px" data-edit>Live demo</div></div>
    <div class="shot-line k-text" data-edit>Demo video.</div>
    <div class="shot vid"><video src="media/demo.mp4" muted playsinline preload="auto"></video><div class="vbar"><i></i></div><div class="vhint">CLICK VIDEO TO PAUSE</div></div>
    ${count('%N%')}` };
  const bot = S.splice(S.findIndex(c => c.key === 'bot'), 1)[0];
  const afterDemo = shotCards.splice(-2); // decision receipt + decision log
  S.splice(2, 0, ...shotCards, bot, videoCard, ...afterDemo);
  S.forEach((c, i) => { const n = String(i + 1).padStart(2, '0'); c.html = c.html.replaceAll('%N%', n).replaceAll('%T%', String(S.length)); });
  window.PITCH = S;
})();
</script>
<script>// Presenter for the seven-slide pitch: splash waits for a key, the reference intro plays,
// then the welcome card falls away into the zoomed-in content cards while the orb travels along,
// and ends on a blank white page where the orb waves goodbye.
(function () {
  const AUDIO = window.DECK_AUDIO || {};
  const stage = document.getElementById('stage'), deckEl = document.getElementById('deck'), introStack = document.getElementById('stack');
  const hud = document.getElementById('hud'), count = document.getElementById('count'), editbar = document.getElementById('editbar');
  const B = window.Buddy, I = window.INTRO;
  const eIO = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

  function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${s})`; }
  addEventListener('resize', fit); fit();

  // ---------- audio ----------
  let actx = null, master = null, muted = false; const bufs = {};
  function initAudio() {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.connect(actx.destination);
      for (const [k, b64] of Object.entries(AUDIO)) { const bin = atob(b64), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); actx.decodeAudioData(arr.buffer).then(b => bufs[k] = b).catch(() => {}); }
    } catch (e) { actx = null; }
  }
  function play(name, when = 0, gain = 1, offset = 0) {
    if (window.__onPlay) window.__onPlay(name, when, gain, offset);
    if (!actx || !bufs[name]) return null;
    const s = actx.createBufferSource(), g = actx.createGain(); g.gain.value = gain; s.buffer = bufs[name]; s.connect(g); g.connect(master);
    s.start(actx.currentTime + Math.max(0, when), offset); return s;
  }

  // ---------- geometry: card-local reference px -> stage px (content cards are zoomed in) ----------
  const ZC = 1.26, OXZ = 960, OYZ = 552;
  const toStage = (x, y, z) => { const p = CARDS.local(x, y); return [OXZ + (p[0] - OXZ) * z, OYZ + (p[1] - OYZ) * z]; };
  const onTop = (x, y, r, pose, look, extra = {}) => { const p = toStage(x, y, ZC); return { x: p[0], y: p[1] - r, r, ground: true, pose, look: look && toStage(...look, ZC), ...extra }; };
  const hover = (x, y, r, pose, look, extra = {}) => { const p = toStage(x, y, ZC); return { x: p[0], y: p[1], r, pose, look: look && toStage(...look, ZC), ...extra }; };
  const HOME = { x: I.HOME.x, y: I.HOME.y, r: I.HOME.r, pose: 'logo' };

  // ---------- slides ----------
  const P = window.PITCH;
  const SLIDES = [{ key: 'welcome', anchors: [HOME] }];
  const byKey = k => P.find(s => s.key === k);
  SLIDES.push({ ...byKey('problem'), anchors: [onTop(124, 262, 44, 'point', [343, 330]), onTop(343, 262, 44, 'tada', [600, 300])], stepStyle: 'hop', loop: true });
  SLIDES.push({ ...byKey('solution'), anchors: [hover(479, 146, 46, 'present', [479, 360])] });
  const shotSlide = s => ({ ...s, anchors: [onTop(s.shot.perchX, 160, 34, 'point', s.shot.look)] });
  const AFTER_DEMO = ['shot-network', 'shot-log'];
  P.filter(s => s.shot && !AFTER_DEMO.includes(s.key)).forEach(s => SLIDES.push(shotSlide(s)));
  SLIDES.push({ ...byKey('bot'), anchors: [hover(118, 300, 70, 'present', [560, 280])], talk: true, loop: true });
  SLIDES.push({ ...byKey('demo'), anchors: [onTop(880, 160, 34, 'think', [480, 370])] });
  AFTER_DEMO.forEach(k => SLIDES.push(shotSlide(byKey(k))));
  SLIDES.push({ ...byKey('different'), anchors: [hover(880, 96, 40, 'point', [700, 330])] });
  SLIDES.push({ ...byKey('perf'), anchors: [onTop(700, 176, 34, 'point', [355, 350])] });
  SLIDES.push({ ...byKey('trust'), anchors: [onTop(387, 81, 22, 'perch', [700, 81])], chain: [1, 2, 3, 4, 5, 6].map(i => onTop(387, 81 + i * 64, 22, i === 6 ? 'tada' : 'perch', [700, 81 + i * 64])), chainMark: 'box', loop: true });
  SLIDES.push({ ...byKey('value'), anchors: [hover(872, 118, 46, 'wave', [480, 380])] });
  SLIDES.push({ key: 'bye', tone: 'blank', html: `<div class="k-t bye-t" data-edit>Thank you</div>
    <div class="k-text bye-note" data-edit>Thank you for your time and attention. We would love to hear your questions.</div>`, anchors: [{ x: 960, y: 540, r: 96, pose: 'bye' }], loop: true });

  SLIDES.forEach((s, j) => {
    s.el = s.key === 'welcome' ? CARDS.build('welcome') : CARDS.build(s.key, { html: s.html, tone: s.tone });
    if (s.tone === 'blank') s.el.classList.add('blank');
    s.el.style.zIndex = 100 - j; deckEl.appendChild(s.el);
    if (s.key === 'welcome') s.el.querySelectorAll('.word span').forEach(sp => sp.style.opacity = 1);
    s.words = [...s.el.querySelectorAll('.quote .w')];
    s.videoEl = s.el.querySelector('video');
    if (s.videoEl) {
      const v = s.videoEl, wrap = v.parentElement, bar = wrap.querySelector('.vbar i');
      v.addEventListener('timeupdate', () => { bar.style.width = (v.duration ? v.currentTime / v.duration * 100 : 0) + '%'; });
      v.addEventListener('pause', () => wrap.classList.add('paused')); v.addEventListener('play', () => wrap.classList.remove('paused'));
      wrap.addEventListener('click', e => { e.stopPropagation(); if (editing) return; v.paused ? v.play().catch(() => {}) : v.pause(); });
    }
    s.marks = s.chainMark === 'box' ? [...s.el.querySelectorAll('.box')] : [];
  });
  function resetSlide(s) {
    s.words.forEach(w => { w.style.transition = 'none'; w.style.opacity = .12; });
    s.marks.forEach(m => m.classList.remove('on'));
  }
  function mark(s, i) {
    const m = s.marks[i]; if (m) m.classList.add('on');
  }
  SLIDES.forEach(resetSlide);

  // continuous stack position; content cards zoom in as the welcome card falls away
  let pos = 0, target = 0, animFrom = 0, animT0 = 0; const ANIM = .45;
  function layoutDeck() {
    const t = performance.now() / 1000;
    const k = Math.min(1, (t - animT0) / ANIM); pos = animFrom + (target - animFrom) * eIO(k);
    const z = 1 + (ZC - 1) * clamp(pos);
    deckEl.style.transform = `translate(${OXZ}px, ${OYZ}px) scale(${z}) translate(${-OXZ}px, ${-OYZ}px)`;
    SLIDES.forEach((s, j) => {
      const rel = j - pos;
      if (rel <= -1) { s.el.style.visibility = 'hidden'; return; }
      if (rel < 0) CARDS.pose(s.el, { depth: 0, exit: eIO(-rel) });
      else CARDS.pose(s.el, { depth: rel });
      // the stack behind the welcome card stays hidden until it starts to fall
      if (j > 0 && pos < .02 && rel > 0) s.el.style.visibility = 'hidden';
    });
    requestAnimationFrame(layoutDeck);
  }
  function moveTo(n) { animFrom = pos; target = n; animT0 = performance.now() / 1000; }

  // ---------- intro ----------
  let phase = 'splash', clock0 = performance.now() / 1000, introStart = 0, audioClock = false;
  const introNow = () => audioClock && actx ? actx.currentTime - introStart : performance.now() / 1000 - introStart;
  function loop() {
    if (phase === 'splash') { I.render((performance.now() / 1000 - clock0) % 3.1); requestAnimationFrame(loop); return; }
    if (phase === 'intro') { const t = introNow(); if (t >= I.DUR) { endIntro(); return; } I.render(Math.max(4.6, t)); requestAnimationFrame(loop); }
  }
  requestAnimationFrame(loop);
  let introSrc = null;
  function startIntro() {
    if (phase !== 'splash') return;
    initAudio(); phase = 'intro'; peekHud();
    const go = () => {
      if (actx && bufs.intro) { introSrc = play('intro', .03, 1, 4.6); introStart = actx.currentTime + .03 - 4.6; audioClock = true; }
      else introStart = performance.now() / 1000 - 4.6;
    };
    let tries = 0; (function wait() { if (!actx || bufs.intro || tries++ > 30) go(); else setTimeout(wait, 25); })();
  }
  function endIntro() {
    if (phase === 'deck') return;
    if (introSrc) { try { introSrc.stop(); } catch (e) {} }
    phase = 'deck'; I.render(I.DUR);
    introStack.style.display = 'none'; deckEl.style.visibility = 'visible';
    requestAnimationFrame(layoutDeck);
  }

  // ---------- per-slide choreography ----------
  let gen = 0;
  const later = (ms, fn) => { const g = gen; setTimeout(() => { if (g === gen) fn(); }, ms); };
  function arrive(s, tr) {
    const land = tr ? (tr.t0 - performance.now() / 1000 + tr.antic + tr.flight) * 1000 : 0;
    if (s.videoEl) later(land + 150, () => { try { s.videoEl.currentTime = 0; } catch (e) {} s.videoEl.play().catch(() => {}); });
    if (s.talk) later(land + 250, () => {
      const per = 135; B.talkUntil = performance.now() / 1000 + s.words.length * per / 1000;
      s.words.forEach((w, i) => later(i * per, () => { w.style.transition = 'opacity .25s ease'; w.style.opacity = 1; if (i % 3 === 0) play('pop', 0, .18); }));
    });
    if (s.chain) {
      later(land + 120, () => { mark(s, 0); play('pop', 0, .45); });
      s.chain.forEach((an, i) => later(land + 600 + i * 560, () => {
        const h = B.go(an, { style: 'hop' }); play('hop', .05, .5);
        later(((h ? h.antic + h.flight : .4)) * 1000, () => { mark(s, i + 1); play('pop', 0, .45); });
      }));
    }
  }

  // ---------- navigation ----------
  let cur = 0, step = 0, editing = false;
  const showCount = () => { count.textContent = cur === 0 ? 'welcome' : `${cur} / ${SLIDES.length - 1}`; };
  function goSlide(n, dir) {
    if (n < 0 || n >= SLIDES.length || n === cur) return;
    gen++; B.talkUntil = 0; SLIDES.forEach(x => { if (x.videoEl) x.videoEl.pause(); });
    const to = SLIDES[n];
    cur = n; step = dir > 0 ? 0 : to.anchors.length - 1;
    resetSlide(to); moveTo(n); play('flick', 0, .6);
    const an = to.anchors[step];
    const fromOff = !B.visible ? { x: 2150, y: -120 } : null;
    const tr = B.go(an, { style: 'zoom', loop: !!to.loop && dir > 0, bend: dir > 0 ? -1 : 1, from: fromOff, delay: .14 });
    if (tr) { play('whoosh', .14 + tr.antic * .5, .8); play('land', .14 + tr.antic + tr.flight, .6); }
    arrive(to, tr); showCount();
  }
  function next() {
    if (phase === 'splash') { startIntro(); return; }
    if (phase === 'intro') { endIntro(); return; }
    const s = SLIDES[cur];
    if (step < s.anchors.length - 1) {
      step++; const tr = B.go(s.anchors[step], { style: s.stepStyle || 'zoom' });
      if (tr) { play('hop', tr.antic * .5, .8); play('land', tr.antic + tr.flight, .45); }
      return;
    }
    goSlide(cur + 1, 1);
  }
  function prev() {
    if (phase !== 'deck') return;
    const s = SLIDES[cur];
    if (step > 0) { step--; const tr = B.go(s.anchors[step], { style: s.stepStyle || 'zoom' }); if (tr) play('hop', tr.antic * .5, .8); return; }
    goSlide(cur - 1, -1);
  }

  // ---------- input ----------
  stage.addEventListener('click', e => {
    if (editing) return;
    if (phase === 'deck' && B.visible) {
      const r = stage.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * 1920, y = (e.clientY - r.top) / r.height * 1080;
      if (Math.hypot(x - B.x, y - B.y) < B.r * 1.2) { B.poke(); play('pop', 0, .6); return; }
    }
    next();
  });
  addEventListener('keydown', e => {
    if (editing) { if (e.key === 'Escape') toggleEdit(false); return; }
    if (e.key === 'f' || e.key === 'F') { const el = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.())?.catch?.(() => {}); peekHud(); return; }
    if (e.key === 'm' || e.key === 'M') { muted = !muted; if (master) master.gain.value = muted ? 0 : 1; peekHud(); return; }
    if ((e.key === 'e' || e.key === 'E') && phase === 'deck') { toggleEdit(true); return; }
    if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); prev(); }
    else if (!['Shift', 'Control', 'Alt', 'Meta', 'Tab'].includes(e.key)) { e.preventDefault(); next(); }
    peekHud();
  });
  let hudTimer = null;
  function peekHud() { hud.classList.remove('hide'); clearTimeout(hudTimer); hudTimer = setTimeout(() => hud.classList.add('hide'), 2600); }
  addEventListener('mousemove', peekHud);
  showCount();

  // ---------- text editing (saved in this browser) ----------
  const editables = [...deckEl.querySelectorAll('[data-edit]')], KEY = 'inventra-pitch-v6';
  try { const saved = JSON.parse(localStorage.getItem(KEY) || '{}'); editables.forEach((el, i) => { if (saved[i] != null) el.textContent = saved[i]; }); } catch (e) {}
  function save() { try { const o = {}; editables.forEach((el, i) => o[i] = el.textContent); localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
  function toggleEdit(on) {
    editing = on; document.body.classList.toggle('editing', on); editbar.hidden = !on;
    editables.forEach(el => on ? el.setAttribute('contenteditable', 'plaintext-only') : el.removeAttribute('contenteditable'));
    if (!on) save();
  }
  editables.forEach(el => el.addEventListener('input', save));
  window.__deck = { next, prev, state: () => ({ phase, cur, step }) };
})();
</script>
